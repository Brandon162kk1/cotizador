[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
loglevel=warn
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:xvfb]
command=/usr/bin/Xvfb :%(ENV_DISPLAY_NUM)s -screen 0 1920x1080x24
autostart=true
autorestart=true
priority=10

[program:openbox]
command=/usr/bin/openbox
environment=DISPLAY=":%(ENV_DISPLAY_NUM)s"
autostart=true
autorestart=true
priority=20

[program:x11vnc]
command=/usr/bin/x11vnc -forever -display :%(ENV_DISPLAY_NUM)s -nopw -shared #-viewonly
autostart=true
autorestart=true
priority=30

[program:novnc]
command=/opt/novnc/utils/novnc_proxy --vnc localhost:5900 --listen %(ENV_NOVNC_PORT)s --web /opt/novnc
directory=/opt/novnc
autostart=true
autorestart=true
priority=40

[program:pythonapp]
command=python3 /app/Codigo/main.py
directory=/app
environment=DISPLAY=":%(ENV_DISPLAY_NUM)s",PYTHONPATH="/app"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
priority=50